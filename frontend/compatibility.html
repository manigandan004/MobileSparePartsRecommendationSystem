<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Compatibility</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Check Spare-Part Compatibility</h1><input id="part" type="number" value="1" placeholder="Part ID"><input id="model" placeholder="Exact mobile model"><button onclick="check()">Check</button><div id="out"></div></main><script>async function check(){const part=document.getElementById('part').value,model=encodeURIComponent(document.getElementById('model').value);const x=await fetch(`/api/compatibility?partId=${part}&model=${model}`).then(r=>r.json());document.getElementById('out').innerHTML=`<div class="card"><h2>${x.compatible?'Compatible':'Not confirmed'}</h2><p>${x.message}</p></div>`}</script></body></html>
