<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Brand & Model</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Select Mobile Brand and Model</h1><select id="brand" onchange="loadModels()"><option>Loading...</option></select><select id="model"></select><div id="stock"></div></main><script>async function init(){const b=await fetch('/api/brands').then(r=>r.json());brand.innerHTML=b.map(x=>`<option>${x}</option>`).join('');loadModels()}async function loadModels(){const m=await fetch('/api/models?brand='+encodeURIComponent(brand.value)).then(r=>r.json());model.innerHTML=m.map(x=>`<option>${x}</option>`).join('');const p=await fetch('/api/spare-parts?model='+encodeURIComponent(model.value)).then(r=>r.json());stock.innerHTML=p.map(x=>`<div class="card">${x.partName} — ₹${x.price} — Stock ${x.quantity}</div>`).join('')||'<p>No parts.</p>'}init();</script></body></html>
