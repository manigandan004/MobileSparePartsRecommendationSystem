<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MSP Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
    <div class="brand">MSP Management</div>
    <nav><a href="index.html">Home</a><a href="register.html">Register</a><a href="models.html">Models</a></nav>
</header>

<main class="form-page">
    <form id="registerForm" class="card-form">
        <h1>Create Account</h1>
        <p>Register for the Mobile Spare Parts Management System.</p>

        <label>Username
            <input id="username" name="username" required minlength="3">
        </label>

        <label>Email
            <input id="email" name="email" type="email" required>
        </label>

        <label>Password
            <input id="password" name="password" type="password" required minlength="6">
        </label>

        <button class="button" type="submit">Register</button>
        <div id="message" class="message"></div>
    </form>
</main>

<script>
document.getElementById("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = new FormData(event.target);
    const body = new URLSearchParams(form);

    const response = await fetch("/api/register", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body
    });

    const data = await response.json();
    const message = document.getElementById("message");
    message.textContent = data.message;
    message.className = response.ok ? "message success" : "message error";

    if (response.ok) event.target.reset();
});
</script>
</body>
</html>
