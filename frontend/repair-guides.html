<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Repair Guides</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Integrated Repair Guides</h1><input id="model" placeholder="Model"><button onclick="load()">Load Guides</button><div id="out"></div></main><script>async function load(){const x=await fetch('/api/repair-guides?model='+encodeURIComponent(model.value)).then(r=>r.json());out.innerHTML=x.map(g=>`<div class="card"><h3>${g.title}</h3><p>${g.model}</p><p>${g.steps}</p></div>`).join('')}</script></body></html>
