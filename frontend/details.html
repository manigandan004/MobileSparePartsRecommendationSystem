<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Product Details</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Product Details</h1><div id="p"></div></main><script>const id=new URLSearchParams(location.search).get('id')||1;fetch('/api/product?id='+id).then(r=>r.json()).then(p=>document.getElementById('p').innerHTML=p.id?`<div class="card"><h2>${p.partName}</h2><p>Model: ${p.model}</p><p>Price: ₹${p.price}</p><p>Available stock: ${p.quantity}</p><a href="reviews.html?partId=${p.id}">Reviews & Ratings</a></div>`:`<p>${p.message}</p>`);</script></body></html>
