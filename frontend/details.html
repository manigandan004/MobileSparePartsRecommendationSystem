<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details - PartPulse MSP</title><link rel="stylesheet" href="style.css"></head><body><nav id="nav" class="nav"><span class="brand">PartPulse MSP</span></nav><main class="page"><div id="out"></div><script>async function load(){let p=await api('/api/product?id='+qs('id'));document.querySelector('#out').innerHTML=`<div class="card"><span class="badge">${p.category}</span><h1>${p.part_name}</h1><p>${p.brand} ${p.model}</p><p>${p.description}</p><p class="price">${money(p.price)}</p><p>Stock: ${p.quantity} • Warranty: ${p.warranty_months} months • ⭐ ${p.rating} (${p.review_count} reviews)</p><div class="row"><button class="btn" id="cart">Add to Cart</button><a class="btn secondary" href="reviews.html?partId=${p.id}">Reviews</a><a class="btn secondary" href="compare.html?ids=${p.id}">Compare</a></div></div>`;document.querySelector('#cart').onclick=async()=>{try{await requireCustomer();await api('/api/cart',{method:'POST',body:new URLSearchParams({partId:p.id,quantity:1})});alert('Added to cart')}catch(x){if(x.message!=='Login required')alert(x.message)}}}load()</script></main><script src="app.js"></script><script>nav();</script></body></html>
