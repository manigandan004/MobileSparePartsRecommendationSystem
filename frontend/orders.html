<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Orders</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Order Tracking</h1><section class="card"><h2>Place Demo Order</h2><input id="user" value="demo"><input id="part" type="number" value="1"><input id="qty" type="number" value="1"><input id="price" type="number" value="8500"><button onclick="place()">Place Order</button></section><section class="card"><h2>Track / Update Order</h2><input id="id" value="1001" type="number"><button onclick="track()">Track</button><select id="status"><option>PACKED</option><option>SHIPPED</option><option>OUT_FOR_DELIVERY</option><option>DELIVERED</option></select><button onclick="updateStatus()">Update Status</button></section><div id="out"></div></main><script>async function place(){const f=new URLSearchParams({username:user.value,partId:part.value,quantity:qty.value,unitPrice:price.value});const x=await fetch('/api/orders',{method:'POST',body:f}).then(r=>r.json());if(x.id)id.value=x.id;out.innerHTML='<div class="card">Order created: #'+(x.id||x.message)+'</div>'}async function track(){const x=await fetch('/api/orders?id='+id.value).then(r=>r.json());out.innerHTML=x.id?`<div class="card"><h2>Order #${x.id}</h2><p>Status: <b>${x.status}</b></p><p>Part ID: ${x.partId} · Qty: ${x.quantity} · Total: ₹${x.total}</p></div>`:`<p>${x.message}</p>`}async function updateStatus(){const f=new URLSearchParams({id:id.value,status:status.value});const x=await fetch('/api/orders',{method:'PUT',body:f}).then(r=>r.json());out.innerHTML='<div class="card">Status updated: '+x.success+'</div>';track()}</script></body></html>
