<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - PartPulse MSP</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .order-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .order-card h2 {
            margin-top: 0;
        }

        .status {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            position: relative;
        }

        .status::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 8%;
            right: 8%;
            height: 3px;
            background: #ddd;
            z-index: 0;
        }

        .step {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            margin: auto;
            line-height: 30px;
            color: white;
            font-weight: bold;
        }

        .active .circle {
            background: #2563eb;
        }

        .step p {
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Track Your Order</h1>

    <div class="order-card">

        <h2>Order #1001</h2>

        <p><strong>Part:</strong> Samsung S24 Charging Port</p>
        <p><strong>Quantity:</strong> 1</p>
        <p><strong>Status:</strong> Out for Delivery</p>

        <div class="status">

            <div class="step active">
                <div class="circle">✓</div>
                <p>Placed</p>
            </div>

            <div class="step active">
                <div class="circle">✓</div>
                <p>Packed</p>
            </div>

            <div class="step active">
                <div class="circle">✓</div>
                <p>Shipped</p>
            </div>

            <div class="step active">
                <div class="circle">✓</div>
                <p>Out for Delivery</p>
            </div>

            <div class="step">
                <div class="circle">5</div>
                <p>Delivered</p>
            </div>

        </div>

    </div>

    <a class="back" href="index.html">← Back to Home</a>

</div>

</body>
</html>
