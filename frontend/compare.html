<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Compare Spare Parts</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Compare Spare Parts</h1><input id="ids" value="1,2" placeholder="Part IDs e.g. 1,2,3"><button onclick="load()">Compare</button><div id="out"></div></main><script>async function load(){const x=await fetch('/api/compare?ids='+encodeURIComponent(ids.value)).then(r=>r.json());out.innerHTML='<table><tr><th>Part</th><th>Model</th><th>Price</th><th>Stock</th></tr>'+x.map(p=>`<tr><td>${p.partName}</td><td>${p.model}</td><td>₹${p.price}</td><td>${p.quantity}</td></tr>`).join('')+'</table>'}</script></body></html>
