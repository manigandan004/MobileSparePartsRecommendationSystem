<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reviews</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Product Reviews & Ratings</h1><input id="part" type="number" value="1"><input id="user" placeholder="Your name"><input id="rating" type="number" min="1" max="5" value="5"><textarea id="comment" placeholder="Write your review"></textarea><button onclick="add()">Submit Review</button><button onclick="load()">View Reviews</button><div id="out"></div></main><script>const pid=new URLSearchParams(location.search).get('partId')||1;document.getElementById('part').value=pid;async function add(){const f=new URLSearchParams({partId:part.value,username:user.value,rating:rating.value,comment:comment.value});const x=await fetch('/api/reviews',{method:'POST',body:f}).then(r=>r.json());alert(x.message||'Review submitted');load()}async function load(){const x=await fetch('/api/reviews?partId='+part.value+'&sort=rating').then(r=>r.json());out.innerHTML=`<h3>Average: ${x.averageRating}</h3>`+x.reviews.map(r=>`<div class="card"><b>${r.username} · ${r.rating}/5</b><p>${r.comment}</p></div>`).join('')||'<p>No reviews yet.</p>'}load();</script></body></html>
