<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Price Tracking</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Spare Part Price Tracking</h1><div id="out"></div></main><script>fetch('/api/price-tracking').then(r=>r.json()).then(x=>out.innerHTML='<table><tr><th>Part</th><th>Model</th><th>Current</th><th>Previous</th><th>Change</th></tr>'+x.map(p=>`<tr><td>${p.partName}</td><td>${p.model}</td><td>₹${p.currentPrice}</td><td>₹${p.previousPrice}</td><td>${p.change}%</td></tr>`).join('')+'</table>');</script></body></html>
