<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Returns</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Defective Part Return & Replacement</h1><input id="orderId" type="number" value="1001"><input id="reason" placeholder="Reason"><button onclick="submitReturn()">Request Return</button><div id="out"></div></main><script>async function submitReturn(){const f=new URLSearchParams({orderId:orderId.value,reason:reason.value});const x=await fetch('/api/returns',{method:'POST',body:f}).then(r=>r.json());out.innerHTML='<div class="card">Return request created: '+(x.id||x.message)+'</div>'}</script></body></html>
