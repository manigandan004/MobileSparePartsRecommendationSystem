<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Browse Spare Parts</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Browse / Search Spare Parts</h1><input id="q" placeholder="Search part or model"><button onclick="load()">Search</button><div id="list"></div></main><script>async function load(){const q=encodeURIComponent(document.getElementById('q').value);const data=await fetch('/api/spare-parts?search='+q).then(r=>r.json());document.getElementById('list').innerHTML=data.map(p=>`<div class="card"><h3>${p.partName}</h3><p>${p.model} · ₹${p.price} · Stock ${p.quantity}</p><a href="details.html?id=${p.id}">View details</a></div>`).join('')||'<p>No parts found.</p>'}load();</script></body></html>
