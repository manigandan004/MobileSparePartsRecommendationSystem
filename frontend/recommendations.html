<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Recommendations</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a href="index.html">← Home</a><h1>Product Recommendations</h1><input id="model" placeholder="Mobile model"><input id="category" placeholder="Part category"><button onclick="load()">Recommend</button><div id="out"></div></main><script>async function load(){const x=await fetch('/api/recommendations?model='+encodeURIComponent(model.value)+'&category='+encodeURIComponent(category.value)).then(r=>r.json());out.innerHTML=x.map(p=>`<div class="card"><h3>${p.partName}</h3><p>${p.model} · ₹${p.price} · Stock ${p.quantity}</p></div>`).join('')||'<p>No matching recommendations.</p>'}</script></body></html>
